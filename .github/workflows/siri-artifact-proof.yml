name: Siri artifact protocol proof

on:
  push:
    branches: ["feat/artifact-assistant-filter"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siri-artifact-protocol-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact-protocol:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/feat/artifact-assistant-filter'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: restore
      - name: Generate protocol outputs
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          pnpm protocol:gen
          pnpm protocol:gen:swift
          pnpm protocol:gen:kotlin
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const files = [
            'dist/protocol.schema.json',
            'apps/shared/OpenClawKit/Sources/OpenClawProtocol/GatewayModels.swift',
            'apps/android/app/src/main/java/ai/openclaw/app/gateway/GatewayProtocol.kt',
            'apps/android/app/src/main/java/ai/openclaw/app/protocol/OpenClawProtocolConstants.kt',
          ];
          const generators = ['scripts/protocol-gen.ts', 'scripts/protocol-gen-swift.ts', 'scripts/protocol-gen-kotlin.ts'];
          const hashes = (paths) => Object.fromEntries(paths.map((file) => [file, createHash('sha256').update(readFileSync(file)).digest('hex')]));
          writeFileSync('siri-artifact-protocol-proof.json', JSON.stringify({
            sourceSha: process.env.EXPECTED_SOURCE_SHA,
            generators: hashes(generators),
            outputs: hashes(files),
          }, null, 2) + '\n');
          NODE
      - name: Test artifact selection and managed identity
        run: pnpm test src/gateway/server-methods/artifacts.test.ts src/gateway/server-methods/artifacts.managed-lifecycle.test.ts
      - name: Return canonical protocol outputs
        if: ${{ !cancelled() && hashFiles('siri-artifact-protocol-proof.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: siri-artifact-protocol-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            siri-artifact-protocol-proof.json
            dist/protocol.schema.json
            apps/shared/OpenClawKit/Sources/OpenClawProtocol/GatewayModels.swift
            apps/android/app/src/main/java/ai/openclaw/app/gateway/GatewayProtocol.kt
            apps/android/app/src/main/java/ai/openclaw/app/protocol/OpenClawProtocolConstants.kt
